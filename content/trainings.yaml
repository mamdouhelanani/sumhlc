  - title: Trauma Informed Care for Individuals with Developmental Disabilities
    date: 2027-01-13
    startTime: 12:00
    endTime: 14:00
    trainer: Francis Tierney, CSW
    format: virtual
    location: Zoom
    ceus: 2
    credits:
      - 2.0 CEUs (National Association of Social Workers – RI Chapter, RI
        Certification Board Chemical Dependency, and Licensed Mental Health
        Counselors through the RI Mental Health Counselors Association)
      - 2.0 NBCC-approved continuing education credit hours
      - Approved for 2.0 NAADAC CE Hours
    description: Participants will explore how individuals with intellectual and
      developmental disabilities, particularly Autism, experience and respond to
      trauma in unique ways. Participants will learn about specific expressions
      of trauma for people with developmental disabilities that are affected by
      sensory and communication differences. We will apply trauma informed
      principles and pre-existing clinical skills to learn how to better support
      participants in clinical spaces.
    registerUrl: https://us06web.zoom.us/webinar/register/WN_WAf5PYevQjCmTGPM5zfsew
