  # ── Crisis support ──
  - title: BH Link
    url: https://www.bhlink.org/
    kind: website
    category: crisis
    audience: [ individuals, professionals ]
    description: Rhode Island's 24/7 behavioral health crisis line and walk-in Triage Center. Nurses, counselors, psychiatrists and peer specialists help people through a crisis and connect them to ongoing care.
    source: BH Link
    tags: [ hotline, 24/7, walk-in, triage, emergency, mental health, substance use ]

  - title: 988 Suicide & Crisis Lifeline
    url: https://988lifeline.org
    kind: website
    category: crisis
    audience: [ individuals, professionals ]
    description: Call or text 988 any time for free, confidential support during a mental health, substance use or suicidal crisis.
    source: SAMHSA
    tags: [ hotline, suicide, 24/7, text, chat ]

